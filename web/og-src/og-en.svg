<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @font-face { font-family: 'SG'; src: url('../public/fonts/SpaceGrotesk-Latin.woff2'); font-weight: 300 700; }
      @font-face { font-family: 'SG'; src: url('../public/fonts/SpaceGrotesk-Vietnamese.woff2'); font-weight: 300 700;
        unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'JBM'; src: url('../public/fonts/JetBrainsMono-Bold.woff2'); font-weight: 700; }
      .h { font-family: 'SG', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
      .m { font-family: 'JBM', Menlo, monospace; }
    </style>
    <radialGradient id="p" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="k" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ec4899" stop-opacity="0.45"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
    <radialGradient id="b" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#3b82f6" stop-opacity="0.4"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="0.45" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="btn" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0b0716"/>
  <circle cx="160" cy="80" r="420" fill="url(#p)"/>
  <circle cx="1080" cy="560" r="380" fill="url(#k)"/>
  <circle cx="1000" cy="60" r="300" fill="url(#b)"/>

  <svg x="80" y="78" width="56" height="56" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="logo-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1438"/>
      <stop offset="1" stop-color="#0B0716"/>
    </linearGradient>
    <radialGradient id="logo-glow" cx="0.42" cy="0.46" r="0.42">
      <stop offset="0" stop-color="#4AF2A1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4AF2A1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo-mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DF7BE"/>
      <stop offset="1" stop-color="#2FD98A"/>
    </linearGradient>
    <linearGradient id="logo-lilac" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFC8EE"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#logo-bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#logo-glow)"/>
  <rect x="2" y="2" width="508" height="508" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="3"/>
  <!-- "<" : the phone side -->
  <polyline points="384,122 290,234 384,346" fill="none" stroke="url(#logo-lilac)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ">" : the computer side / prompt -->
  <polyline points="128,122 222,234 128,346" fill="none" stroke="url(#logo-mint)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cursor -->
  <rect x="300" y="398" width="84" height="26" rx="8" fill="url(#logo-mint)"/>
  </svg>
  <text x="152" y="120" class="m" font-size="34" fill="#ece9f6">shellx</text>
  <text x="80" y="268" class="h" font-size="84" fill="#ece9f6">Your terminal.</text>
  <text x="80" y="362" class="h" font-size="84" fill="url(#t)">Everywhere.</text>
  <text x="80" y="432" class="h" font-size="28" font-weight="400" fill="#a69fc0">Control your Mac or PC terminal from your phone.</text>
  <text x="80" y="472" class="h" font-size="28" font-weight="400" fill="#a69fc0">End-to-end encrypted · no open ports · free.</text>
  <rect x="80" y="514" width="260" height="60" rx="30" fill="url(#btn)"/>
  <text x="210" y="553" class="h" font-size="26" fill="#fff" text-anchor="middle">shellx.pro</text>

  <g transform="translate(880 150)">
    <rect width="230" height="430" rx="36" fill="#0e0a1c" stroke="#3a2f5c" stroke-width="4"/>
    <rect x="80" y="14" width="70" height="10" rx="5" fill="#2a2145"/>
    <text x="24" y="70" class="m" font-size="15" fill="#4ade80">● paired · encrypted</text>
    <text x="24" y="112" class="m" font-size="15" fill="#f472b6">$ <tspan fill="#ece9f6">npm run build</tspan></text>
    <text x="24" y="140" class="m" font-size="15" fill="#a69fc0">✓ built in 4.2s</text>
    <text x="24" y="176" class="m" font-size="15" fill="#f472b6">$ <tspan fill="#ece9f6">./deploy.sh</tspan></text>
    <text x="24" y="204" class="m" font-size="15" fill="#4ade80">✓ deployed</text>
    <rect x="16" y="330" width="198" height="72" rx="16" fill="#1c1533" stroke="#7c3aed" stroke-width="2"/>
    <text x="34" y="360" class="h" font-size="17" fill="#ece9f6">deploy.sh</text>
    <text x="34" y="386" class="h" font-size="16" fill="#4ade80">✓ exit 0 · 38s</text>
  </g>
</svg>
