name: shellx_acp
description: >-
  Agent Client Protocol (ACP v1) client for ShellX in pure Dart: JSON-RPC 2.0
  over newline-delimited stdio, the ACP types ShellX uses, and a scripted fake
  agent for tests.
version: 1.0.0
publish_to: none
resolution: workspace
environment:
  sdk: ^3.11.0
dev_dependencies:
  async: ^2.13.0
  json_schema: ^5.2.2
  test: ^1.30.0
