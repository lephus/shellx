name: shellx_desktop
description: "ShellX desktop agent for macOS and Windows."
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # A10 D19: files dropped on a pane become paths; images on the clipboard
  # become a temp file. Pinned exactly (native plugins on macOS and
  # Windows): bump with a manual check of both.
  desktop_drop: 0.8.4
  # V2-1 D17: line diffs for the AI tab (pure Dart).
  diff_match_patch: 0.4.1
  ffi: ^2.2.0
  # Vendored and patched, see third_party/flutter_pty/SHELLX_PATCHES.md.
  flutter_pty:
    path: ../../third_party/flutter_pty
  flutter_riverpod: ^3.3.2
  # V2-1 D17: the AI tab's markdown.
  flutter_markdown_plus: 1.0.12
  flutter_secure_storage: ^10.3.4
  http: ^1.5.0
  # A11 D22: the optional global show/hide shortcut. Pinned exactly (native
  # plugin on macOS, Carbon via the HotKey pod, and Windows RegisterHotKey):
  # bump with a manual check of both. Neither side reports a key another app
  # holds, see global_hotkey.dart.
  hotkey_manager: 0.2.3
  intl: ^0.20.2
  launch_at_startup: ^0.5.1
  local_notifier: ^0.1.6
  package_info_plus: ^9.0.1
  pasteboard: 0.5.0
  path: ^1.9.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  # V2-1 D17: the AI tab's read-only code view and its highlighting.
  re_editor: 0.10.0
  re_highlight: 0.0.3
  # Already in the lock file (window_manager uses it): the display list, so
  # a window saved on a monitor that is gone opens centred (A1 D9).
  screen_retriever: ^0.2.2
  shared_preferences: ^2.5.5
  # V2-1 (V2-1a): the ACP client and the AI session model and host.
  shellx_acp: any
  shellx_agent: any
  shellx_ai: any
  shellx_core: any
  tray_manager: ^0.5.3
  # V2-3 D6: WKWebView as a platform view on macOS (tools). Pinned exactly:
  # wkwebview 3.26+ needs Flutter 3.44 / Dart 3.12.
  webview_flutter: 4.14.1
  webview_flutter_wkwebview: 3.25.1
  # V2-3 D7: WebView2 on Windows, a native window over the Flutter one.
  webview_win_floating: 3.0.3
  win32: ^5.15.0
  window_manager: ^0.5.2
  # xterm 4.0.0 (same version as apps/mobile, A1 D12), vendored for one
  # patch: macOS input methods that edit typed text in place (Vietnamese
  # Telex) see the word being typed. See third_party/xterm/SHELLX_PATCHES.md.
  # The terminal also works around 4.0.0's cursor-key and paste handling
  # (terminal_input.dart); bump with the benchmark and a full test run.
  xterm:
    path: ../../third_party/xterm

dev_dependencies:
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/tray/
    - assets/licenses/
    - assets/whats_new.json
  fonts:
    # Terminal font (A1 D16), SIL OFL 1.1: assets/licenses/JetBrainsMono-OFL.txt
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-Italic.ttf
          style: italic
        - asset: assets/fonts/JetBrainsMono-BoldItalic.ttf
          weight: 700
          style: italic
    # SIL OFL 1.1 like the family above: assets/licenses/JetBrainsMono-OFL.txt.
    # The same face one step lighter, as its own family: the default for
    # normal cells (config `font-weight` light). Cells still ask for plain
    # normal / bold, so Light is what "normal" resolves to here.
    - family: JetBrainsMonoLight
      fonts:
        - asset: assets/fonts/JetBrainsMono-Light.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-LightItalic.ttf
          style: italic
        - asset: assets/fonts/JetBrainsMono-BoldItalic.ttf
          weight: 700
          style: italic
