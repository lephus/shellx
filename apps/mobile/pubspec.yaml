name: shellx_mobile
description: "ShellX mobile app: control your computer's terminal from your phone."
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Team base (flutter-base/yallabb)
  adaptive_theme: ^3.7.2
  async: ^2.13.0
  auto_route: 11.1.0
  cupertino_icons: ^1.0.8
  easy_refresh: ^3.4.0
  equatable: ^2.0.8
  flutter_secure_storage: ^10.3.4
  flutter_svg: ^2.2.3
  get_it: ^9.2.0
  injectable: ^2.7.1+4
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  # Pinned exactly, like xterm below: pubspec.lock is not committed, and the controllers rely on
  # this version's behaviour (a signal written after dispose throws). signals_core is signals_flutter's
  # own dependency and carries that behaviour, so it is pinned to the same version rather than left
  # to resolve on its own. Bump signals_flutter, signals_core and xterm together, with a full test run.
  signals_core: 6.3.1
  signals_flutter: 6.3.1
  sliver_tools: ^0.2.12
  toastification: ^3.0.3
  universal_back_gesture: ^2.1.0

  # ShellX
  app_settings: 7.0.0
  device_info_plus: ^12.3.0
  local_auth: ^3.0.2
  mobile_scanner: ^7.4.2
  package_info_plus: ^9.0.1
  shellx_client: any
  shellx_core: any
  url_launcher: ^6.3.2
  # Pinned exactly (see signals_flutter): the terminal works around xterm 4.0.0's cursor-key,
  # modifier and paste handling, which a newer version may change.
  xterm: 4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  http: ^1.6.0
  shared_preferences_platform_interface: ^2.4.1

  # Code generators, pinned exactly: their output is committed and CI checks it is fresh.
  auto_route_generator: 10.5.0
  build_runner: 2.15.1
  dart_style: 3.1.7
  flutter_gen_runner: 5.15.0
  injectable_generator: 2.12.1
  intl_utils: 2.8.14

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/licenses/

  fonts:
    # UI font of the team base, SIL OFL 1.1: assets/licenses/Raleway-OFL.txt
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway-Black.ttf
          weight: 900
        - asset: assets/fonts/Raleway-BlackItalic.ttf
          weight: 900
          style: italic
        - asset: assets/fonts/Raleway-Bold.ttf
          weight: 700
        - asset: assets/fonts/Raleway-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Raleway-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Raleway-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Raleway-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Raleway-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Raleway-Italic.ttf
          style: italic
        - asset: assets/fonts/Raleway-Light.ttf
          weight: 300
        - asset: assets/fonts/Raleway-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Raleway-Medium.ttf
          weight: 500
        - asset: assets/fonts/Raleway-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Raleway-Regular.ttf
        - asset: assets/fonts/Raleway-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Raleway-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Raleway-Thin.ttf
          weight: 100
        - asset: assets/fonts/Raleway-ThinItalic.ttf
          weight: 100
          style: italic
    # Terminal font (spec §9.1), SIL OFL 1.1: assets/licenses/JetBrainsMono-OFL.txt
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-Italic.ttf
          style: italic
        - asset: assets/fonts/JetBrainsMono-BoldItalic.ttf
          weight: 700
          style: italic

flutter_gen:
  output: lib/shared/src/
  line_length: 120
  integrations:
    flutter_svg: true

flutter_intl:
  enabled: true
  output_dir: lib/shared/src/
