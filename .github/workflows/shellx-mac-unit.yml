name: shellx-mac-unit

# Opt-in CI for the app-hosted ShellX Swift Testing suites under cmuxTests/
# (ShellX*.swift). They need the `cmux-unit` scheme, a full app plus test-host
# compile that takes about an hour cold, so it is too heavy to run on every push
# (and never runs on the maintainer's Mac). Run it by hand with workflow_dispatch
# (input `suites`), or push to develop or shellx/** with `[unit]` in the head commit message.
# Setup mirrors shellx-mac.yml; DerivedData uses its own cache key prefix because
# test builds differ from app builds.

on:
  push:
    branches:
      - develop
      - "shellx/**"
    paths-ignore:
      - "relay/**"
      - "web/**"
      - "deploy/**"
      - "docs/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      suites:
        description: "ShellX = every cmuxTests/ShellX*.swift suite; otherwise space-separated suite names"
        required: false
        default: ShellX

permissions:
  contents: read

concurrency:
  # Concurrency is evaluated before the job `if:`; give runs that will be
  # skipped their own group so they cannot cancel a running unit run.
  group: shellx-mac-unit-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[unit]')) && 'run' || github.run_id }}
  cancel-in-progress: true

jobs:
  unit:
    name: App-hosted ShellX suites (macOS)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[unit]')
    runs-on: macos-26
    timeout-minutes: 150
    env:
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      # zig's MachO linker can't resolve libSystem on macOS 26 (upstream
      # ci-macos-compat.yml); GhosttyKit comes prebuilt instead.
      CMUX_SKIP_ZIG_BUILD: "1"
      # No Go on the runner; the tunnel extension is not shipped by ShellX.
      CMUX_WIREGUARD_GO_REQUIRE: "0"
      DERIVED_DATA: /Users/runner/shellx-derived-data
      SOURCE_PACKAGES: /Users/runner/shellx-source-packages
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Resolve suites
        id: suites
        env:
          SUITES_INPUT: ${{ github.event.inputs.suites }}
        run: |
          set -euo pipefail
          input="${SUITES_INPUT:-ShellX}"
          if [ "$input" = "ShellX" ]; then
            list=""
            shopt -s nullglob
            for f in cmuxTests/ShellX*.swift; do
              name="$(basename "$f" .swift)"
              list="${list:+$list }$name"
            done
          else
            list="$input"
          fi
          if [ -z "$list" ]; then
            echo "No ShellX suites found under cmuxTests/; nothing to run."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Suites: $list"
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        if: steps.suites.outputs.run == 'true'
        run: |
          set -euo pipefail
          ./scripts/select-ci-xcode.sh
          version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          echo "XCODE_VER=$version" >> "$GITHUB_ENV"
          xcodebuild -version
          sw_vers

      - name: Capture cache keys
        id: keys
        if: steps.suites.outputs.run == 'true'
        run: |
          set -euo pipefail
          echo "ghostty=$(git -C ghostty rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache GhosttyKit.xcframework
        id: cache-ghosttykit
        if: steps.suites.outputs.run == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: GhosttyKit.xcframework
          key: shellx-ghosttykit-v1-${{ steps.keys.outputs.ghostty }}

      - name: Download prebuilt GhosttyKit.xcframework (sha-pinned)
        if: steps.suites.outputs.run == 'true' && steps.cache-ghosttykit.outputs.cache-hit != 'true'
        run: ./scripts/download-prebuilt-ghosttykit.sh

      - name: Setup Bun
        if: steps.suites.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install Rust
        if: steps.suites.outputs.run == 'true'
        run: ./scripts/install-rust-ci.sh

      - name: Cache Swift packages
        if: steps.suites.outputs.run == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.SOURCE_PACKAGES }}
          key: shellx-spm-v1-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: shellx-spm-v1-

      - name: Sanitize Swift package cache
        if: steps.suites.outputs.run == 'true'
        run: |
          mkdir -p "$SOURCE_PACKAGES"
          python3 scripts/ci/sanitize-xcode-source-packages-cache.py "$SOURCE_PACKAGES"

      - name: Resolve Swift packages
        if: steps.suites.outputs.run == 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if xcodebuild -project cmux.xcodeproj -scheme cmux-unit -configuration Debug \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
              -resolvePackageDependencies; then
              exit 0
            fi
            [ "$attempt" -eq 3 ] && { echo "::error::Swift package resolution failed 3 times"; exit 1; }
            sleep $((attempt * 10))
          done

      - name: Restore DerivedData
        id: restore-dd
        if: steps.suites.outputs.run == 'true'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.DERIVED_DATA }}
          key: shellx-dd-unit-v1-${{ env.XCODE_VER }}-${{ steps.keys.outputs.ghostty }}-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            shellx-dd-unit-v1-${{ env.XCODE_VER }}-${{ steps.keys.outputs.ghostty }}-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            shellx-dd-unit-v1-${{ env.XCODE_VER }}-${{ steps.keys.outputs.ghostty }}-

      - name: Content-derived mtimes for incremental builds
        if: steps.suites.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 scripts/shellx/ci/normalize-mtimes.py .
          # A restored DerivedData lives on a new volume/inode; let XCBuild
          # trust the recorded file signatures anyway (upstream does the same
          # when it adopts a DerivedData seed).
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES

      - name: Run app-hosted suites (cmux-unit)
        id: test
        if: steps.suites.outputs.run == 'true'
        env:
          SUITE_LIST: ${{ steps.suites.outputs.list }}
        run: |
          set -euo pipefail
          # Word-splitting of SUITE_LIST into suite names is intended.
          # shellcheck disable=SC2086
          scripts/shellx/test-app.sh $SUITE_LIST -- \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -disableAutomaticPackageResolution \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$RUNNER_TEMP/unit.log" | grep -E "error:|Test Suite|Test Case.*failed|\*\* TEST" || true
          if grep -q "\*\* TEST FAILED \*\*" "$RUNNER_TEMP/unit.log" \
            || ! grep -q "\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/unit.log"; then
            echo "::error::unit tests failed or did not finish; last 200 lines:"
            tail -n 200 "$RUNNER_TEMP/unit.log"
            exit 1
          fi
          # TEST SUCCEEDED also prints when nothing matched; require proof that
          # tests ran and that every requested suite shows up as a suite line
          # (the echoed -only-testing argument must not count).
          if ! grep -Eq "Test run with [1-9][0-9]* tests?|Executed [1-9][0-9]* tests?" "$RUNNER_TEMP/unit.log"; then
            echo "::error::TEST SUCCEEDED but no tests ran (check suite names)"
            exit 1
          fi
          missing=""
          for s in $SUITE_LIST; do
            grep -Eq "Suite \"?${s}\"? (started|passed|failed)|Test Suite '${s}'" "$RUNNER_TEMP/unit.log" || missing="${missing:+$missing }$s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Requested suites not found in test output: $missing"
            exit 1
          fi

      - name: Prune DerivedData before caching
        id: prune-dd
        if: steps.test.outcome == 'success' && steps.restore-dd.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf "$DERIVED_DATA/Logs" "$DERIVED_DATA/Index.noindex"
          bytes="$(du -sk "$DERIVED_DATA" | awk '{print $1 * 1024}')"
          echo "DerivedData: $((bytes / 1024 / 1024)) MiB"
          # GitHub's per-repo cache budget is 10 GB; never let one entry take it.
          if [ "$bytes" -lt $((7 * 1024 * 1024 * 1024)) ]; then
            echo "save=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DerivedData too large to cache ($((bytes / 1024 / 1024)) MiB)"
          fi

      - name: Save DerivedData
        if: steps.prune-dd.outputs.save == 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.DERIVED_DATA }}
          key: shellx-dd-unit-v1-${{ env.XCODE_VER }}-${{ steps.keys.outputs.ghostty }}-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}

      - name: Annotate unit test errors
        if: failure() && steps.test.outcome == 'failure'
        run: python3 scripts/shellx/ci/annotate-log.py "$RUNNER_TEMP/unit.log" "unit tests"

      - name: Upload unit log on failure
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shellx-mac-unit-log
          path: ${{ runner.temp }}/unit.log
          retention-days: 7
