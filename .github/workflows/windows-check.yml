# Runs the shellx-term suite on real Windows (and macOS for parity), the agent's Dart tests, and
# the desktop part of terminal sharing (installer tests + a Windows build that bundles shellx-term).
# Never on ordinary pushes: only by hand, or by pushing a branch named
# windows-check/** (workflow_dispatch needs this file on the default branch).
name: windows-check

on:
  workflow_dispatch:
  push:
    branches: ['windows-check/**']

permissions:
  contents: read

jobs:
  term:
    name: shellx-term (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: term
    steps:
      # GitHub's Windows runners default to core.autocrlf=true; the tests compare exact LF text.
      - name: Keep LF line endings
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      # Pinned to the dev Mac's version so a newer stable's lints and
      # formatting cannot fail a run the Mac passes.
      - name: Toolchain (Rust 1.95.0)
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
          rustup default 1.95.0
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --features test-hooks -- -D warnings
      - name: Test
        run: cargo test --locked --features test-hooks -- --test-threads=4

  dart:
    name: shellx_core + shellx_agent (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      # The workspace includes the Flutter apps, so resolving it needs the
      # Flutter SDK (pinned to the dev machine's version).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
      - name: Resolve the workspace
        run: flutter pub get
      - name: shellx_core
        working-directory: packages/shellx_core
        run: dart test
      - name: shellx_agent
        working-directory: packages/shellx_agent
        run: dart test

  desktop:
    # Spec §12: the desktop part of terminal sharing on real Windows. The installer's unit tests
    # (startup-file editor, PowerShell probe, bin installer), then a build that must put
    # shellx-term.exe next to ShellX.exe.
    name: desktop terminal sharing (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
      - name: Toolchain (Rust 1.95.0)
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Resolve the workspace
        run: flutter pub get
      - name: Terminal sharing tests
        working-directory: apps/desktop
        run: flutter test test/terminal_sharing test/agent/core_agent_runtime_sharing_test.dart
      - name: flutter build windows
        working-directory: apps/desktop
        run: flutter build windows --release
      - name: shellx-term.exe is next to ShellX.exe
        shell: pwsh
        run: |
          $release = 'apps\desktop\build\windows\x64\runner\Release'
          foreach ($exe in 'ShellX.exe', 'shellx-term.exe') {
            if (-not (Test-Path (Join-Path $release $exe))) { throw "$exe not found in $release" }
          }
          & (Join-Path $release 'shellx-term.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "shellx-term.exe --version failed: $LASTEXITCODE" }
