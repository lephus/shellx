name: ShellX Windows

# ShellX native Windows app (windows/ workspace): the pure-Rust model tests on
# Linux, and the GPUI app build + headless smoke on windows-2025. No secrets,
# nothing is published; the exe is only uploaded as a run artifact.

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - shellx/l6-windows
      - shellx/sprint
    paths:
      - windows/**
      - cmux-tui/crates/**
      - cmux-tui/Cargo.toml
      - .github/workflows/shellx-windows.yml
      - .github/actions/setup-cmux-tui-rust/**
      - scripts/ci/init-submodule.sh
      - scripts/ghostty-zig-version.sh
      - ghostty

permissions: {}

concurrency:
  group: shellx-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model:
    name: model (shellx-model tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Problem matchers (compile and test errors become annotations)
        shell: bash
        run: echo "::add-matcher::.github/problem-matchers/shellx-rust.json"

      - name: Cache target dir
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: windows -> target
          key: shellx-model
          cache-on-failure: true

      - name: Test shellx-model
        working-directory: windows
        run: cargo test --locked -p shellx-model

      - name: Installer coexistence tests
        run: python3 -m unittest discover -s windows/installer -v

  remote-e2e:
    name: remote-e2e (shellx-remote vs cmux-relay + cmux-tui)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Init ghostty submodule
        shell: bash
        run: bash scripts/ci/init-submodule.sh ghostty

      - name: Resolve Ghostty Zig version
        id: ghostty-zig-version
        shell: bash
        run: echo "version=$(bash ./scripts/ghostty-zig-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install zig
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: ${{ steps.ghostty-zig-version.outputs.version }}

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Problem matchers (compile and test errors become annotations)
        shell: bash
        run: echo "::add-matcher::.github/problem-matchers/shellx-rust.json"

      - name: Cache target dirs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            cmux-tui -> target
            windows -> target
          key: shellx-remote-e2e
          cache-on-failure: true

      - name: Build cmux-relay + cmux-tui (test binaries)
        working-directory: cmux-tui
        shell: bash
        env:
          # Test binaries only: skip the shipping profile's fat LTO.
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          unset CMUX_GHOSTTY_SRC
          cargo build --release --locked -p cmux-relay -p cmux-tui
          ls -la target/release/cmux-relay target/release/cmux-tui

      - name: Test shellx-remote (unit)
        working-directory: windows
        shell: bash
        run: |
          unset CMUX_GHOSTTY_SRC
          cargo test --locked -p shellx-remote

      - name: shellx-remote relay e2e
        working-directory: windows
        shell: bash
        env:
          SHELLX_E2E_BIN_DIR: ${{ github.workspace }}/cmux-tui/target/release
        run: |
          unset CMUX_GHOSTTY_SRC
          cargo test --locked -p shellx-remote --test relay_e2e -- --ignored --nocapture

  app:
    name: app (x86_64-pc-windows-msvc)
    runs-on: windows-2025
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      TARGET: x86_64-pc-windows-msvc
      APP_EXE: windows/target/x86_64-pc-windows-msvc/release/shellx-desktop.exe
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Init ghostty submodule
        shell: bash
        run: bash scripts/ci/init-submodule.sh ghostty

      - name: Resolve Ghostty Zig version
        id: ghostty-zig-version
        shell: bash
        run: echo "version=$(bash ./scripts/ghostty-zig-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install zig
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: ${{ steps.ghostty-zig-version.outputs.version }}

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Problem matchers (compile and test errors become annotations)
        shell: bash
        run: echo "::add-matcher::.github/problem-matchers/shellx-rust.json"

      - name: Install Rust target
        shell: bash
        run: rustup target add "$TARGET"

      - name: Cache target dir
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: windows -> target
          key: shellx-app
          cache-on-failure: true

      - name: Show toolchain
        shell: bash
        run: |
          zig version
          rustc --version --verbose
          cargo --version

      - name: Build shellx-desktop
        id: build-app
        working-directory: windows
        shell: bash
        run: |
          unset CMUX_GHOSTTY_SRC
          cargo build --release --locked -p shellx-app --target "$TARGET"
          ls -la "target/$TARGET/release/"

      - name: Test shellx-model
        working-directory: windows
        shell: bash
        run: |
          unset CMUX_GHOSTTY_SRC
          cargo test --locked -p shellx-model --target "$TARGET"

      # Compile proof of the in-process remote client on Windows (relay v2,
      # Noise, mux control), plus its unit tests on NTFS. Release profile so
      # it reuses the shellx-app build's dependencies.
      - name: Build shellx-remote
        working-directory: windows
        shell: bash
        run: |
          unset CMUX_GHOSTTY_SRC
          cargo build --release --locked -p shellx-remote --target "$TARGET"

      - name: Test shellx-remote
        working-directory: windows
        shell: bash
        run: |
          unset CMUX_GHOSTTY_SRC
          cargo test --release --locked -p shellx-remote --target "$TARGET"

      # The app's unit tests (remote session/link, pairing, links store, core
      # service, TermCore) on Windows too, not only on the Mac.
      - name: Test shellx-app
        working-directory: windows
        shell: bash
        timeout-minutes: 15
        run: |
          unset CMUX_GHOSTTY_SRC
          cargo test --release --locked -p shellx-app --bin shellx-desktop --target "$TARGET"

      - name: Stage artifact
        id: stage
        if: always() && steps.build-app.outcome == 'success'
        shell: bash
        run: |
          mkdir -p dist
          cp "$APP_EXE" dist/
          # Ship any runtime DLL the build produced next to the exe.
          find "windows/target/$TARGET/release" -maxdepth 1 -name '*.dll' -exec cp {} dist/ \; || true
          ls -la dist
          # Imported DLLs, so a missing runtime dependency shows up here.
          dumpbin_path="$(ls /c/Program\ Files/Microsoft\ Visual\ Studio/*/*/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe 2>/dev/null | head -1)"
          if [[ -z "$dumpbin_path" ]]; then
            echo "::error::dumpbin.exe not found; cannot verify the static CRT"
            exit 1
          fi
          "$dumpbin_path" //nologo //dependents dist/shellx-desktop.exe | tee dependents.log
          # Sanity: dumpbin really listed imports.
          grep -qi 'KERNEL32' dependents.log || { echo "::error::dumpbin printed no dependents"; exit 1; }
          # Static CRT (windows/.cargo/config.toml): no VC++ runtime may be imported.
          if grep -iE 'VCRUNTIME140|MSVCP140' dependents.log; then
            echo "::error::shellx-desktop.exe imports the dynamic VC++ runtime"
            exit 1
          fi

      - name: Upload shellx-desktop
        if: always() && steps.stage.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shellx-desktop
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Headless smoke (ConPTY + libghostty-vt, no window)
        shell: bash
        run: |
          set -o pipefail
          timeout 180 "./$APP_EXE" --smoke 2>&1 | tee smoke.log
          # The release exe is a GUI-subsystem binary; the exit code is the
          # verdict, the log line is informational.
          grep -F "smoke: PASS" smoke.log || echo "::warning::no PASS line captured (exit code was 0)"

      - name: Read the app version (windows/Cargo.toml)
        shell: bash
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' windows/Cargo.toml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::cannot read the workspace version from windows/Cargo.toml: '$version'"; exit 1; }
          echo "SHELLX_VERSION=$version" >> "$GITHUB_ENV"

      - name: Version flag
        shell: bash
        run: |
          set -o pipefail
          "./$APP_EXE" --version 2>&1 | tee version.log
          # The release exe is a GUI-subsystem binary, so its stdout may not
          # reach a pipe; the exit code (set -e semantics above) is the
          # verdict and the text check is informational.
          grep -F "shellx-desktop $SHELLX_VERSION" version.log || echo "::warning::no version text captured (exit code was 0)"

  installer:
    name: installer (Inno Setup, unsigned)
    needs: app
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download shellx-desktop
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: shellx-desktop
          path: staged

      - name: Read the app version (windows/Cargo.toml)
        shell: bash
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' windows/Cargo.toml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::cannot read the workspace version from windows/Cargo.toml: '$version'"; exit 1; }
          echo "SHELLX_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build installer
        shell: pwsh
        run: ./windows/installer/build-installer.ps1 -Version $env:SHELLX_VERSION -SourceDir "$env:GITHUB_WORKSPACE\staged" -OutputDir "$env:GITHUB_WORKSPACE\dist" -AppIcon "$env:GITHUB_WORKSPACE\windows\shellx-app\resources\app_icon.ico"

      - name: Coexistence check
        shell: pwsh
        run: python windows/installer/check_coexistence.py

      - name: Smoke install, run, uninstall
        shell: pwsh
        run: |
          $setup = "$env:GITHUB_WORKSPACE\dist\ShellX-Setup-$env:SHELLX_VERSION.exe"
          $i = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER',"/LOG=$env:GITHUB_WORKSPACE\install.log" -Wait -PassThru
          if ($i.ExitCode -ne 0) { throw "installer exit $($i.ExitCode)" }
          $dir = "$env:LOCALAPPDATA\Programs\ShellX Native"
          if (-not (Test-Path "$dir\shellx-desktop.exe")) { throw 'exe missing after install' }
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\ShellX.lnk"
          if (-not (Test-Path $lnk)) { throw 'Start-menu shortcut ShellX.lnk missing' }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          if ($target -ne "$dir\shellx-desktop.exe") { throw "ShellX.lnk points at '$target'" }
          $p = Start-Process "$dir\shellx-desktop.exe" -ArgumentList '--smoke-ui-assets' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "--smoke-ui-assets exit $($p.ExitCode)" }
          $u = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstaller exit $($u.ExitCode)" }
          # The uninstaller copies itself to temp and deletes the dir after it exits: poll.
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path $dir) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $dir) { throw 'install dir still present 30 s after uninstall' }

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ShellX-Setup-${{ env.SHELLX_VERSION }}
          path: dist/ShellX-Setup-${{ env.SHELLX_VERSION }}.exe
          if-no-files-found: error
          retention-days: 14
