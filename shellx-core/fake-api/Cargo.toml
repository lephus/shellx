[package]
name = "shellx-fake-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
description = "In-memory subset of the ShellX K1 API for shellx-core tests and the remote e2e harness"
publish = false

[lib]
name = "shellx_fake_api"
path = "src/lib.rs"

[[bin]]
name = "shellx-fake-api"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
serde_json = "1"
getrandom = "0.3"
base64 = "0.22"
