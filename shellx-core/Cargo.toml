[package]
name = "shellx-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
description = "ShellX account/relay client core: one C entry point for the Mac app, a crate for the Windows app"
publish = false

[lib]
name = "shellx_core"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "shellx-core-cli"
path = "src/bin/shellx-core-cli.rs"

[dependencies]
serde_json = "1"
libc = "0.2"
zeroize = "1"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
# TLS = rustls with the ring provider only (no aws-lc, no native-tls).
ureq = { version = "3.3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tempfile = "3"
shellx-fake-api = { path = "fake-api" }

[profile.release]
panic = "unwind"
lto = "thin"

[workspace]
members = [".", "fake-api"]
