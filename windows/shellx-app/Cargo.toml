[package]
name = "shellx-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "shellx-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-channel = "2"
cmux-pty = { path = "../../cmux-tui/crates/cmux-pty" }
ghostty-vt = { path = "../../cmux-tui/crates/ghostty-vt" }
# The log file (logger.rs); already in the tree through gpui.
log = "0.4"
shellx-core = { path = "../../shellx-core" }
shellx-model = { path = "../shellx-model" }
shellx-remote = { path = "../shellx-remote" }
serde_json = { workspace = true }

# GPUI from crates.io, pinned exactly. Default features are off so gpui does
# not embed its own manifest resource (ours carries the icon + manifest);
# the Windows backend (Direct3D 11 + DirectWrite) is not feature-gated.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# GetTimeZoneInformation (local offset for "lần cuối HH:MM"),
# SystemParametersInfoW(SPI_GETSCREENREADER) (screen-reader window title) and
# GetUserDefaultUILanguage (the UI language follows the Windows display
# language); 0.61 is already in the tree through gpui's dependencies.
# MonitorFromPoint, GetMonitorInfoW and GetDpiForMonitor (the first window fits
# the primary monitor's work area). GetModuleHandleW and GetCurrentThreadId
# (crash files); MessageBoxW (the crash reporter). The native crash filter:
# SetUnhandledExceptionFilter and EXCEPTION_POINTERS (Diagnostics_Debug,
# Kernel), CreateFileW/WriteFile (Storage_FileSystem, Security; WriteFile is
# gated by System_IO), CreateEventW/CreateProcessW (Security), GetSystemTime
# (SystemInformation).
# --diagnose and the console flags: AttachConsole/SetStdHandle (System_Console),
# RtlGetVersion (Wdk_System_SystemServices + System_SystemInformation),
# EnumDisplayMonitors (Graphics_Gdi), DwmGetCompositionTimingInfo (Graphics_Dwm),
# QueryPerformanceFrequency (System_Performance), the process snapshot
# (System_Diagnostics_ToolHelp), GetKeyboardLayoutList (UI_Input_KeyboardAndMouse).
windows-sys = { version = "0.61", features = [
    "Wdk_System_SystemServices",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# --diagnose's GPU probe: DXGI adapters and the D3D11 feature-level probe are COM interfaces,
# which windows-sys does not wrap. gpui already enables these features of the same 0.61.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
gpui = { version = "=0.2.2", default-features = false }

# Development only: lets the window run on a Mac to check the UI with
# screenshots (windows/dev/mac-shot.sh). Not shipped; the font-kit text system
# and runtime-compiled shaders avoid needing the Xcode Metal toolchain.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
shellx-fake-api = { path = "../../shellx-core/fake-api" }
tempfile = "3"
