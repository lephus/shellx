[package]
name = "shellx-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "GPUI-free in-process client for a ShellX Mac (cmux-tui remote over cmux-relay v2)"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
# No iroh, no WireGuard (no Manaflow endpoints): relay v2 only.
cmux-remote = { path = "../../cmux-tui/crates/cmux-remote", default-features = false }
cmux-remote-protocol = { path = "../../cmux-tui/crates/cmux-remote-protocol" }
getrandom = "0.3"
# wss:// to the real relay: tokio-tungstenite's rustls gets no crypto provider
# from this workspace otherwise (cmux-tui's own workspace enables it through
# other crates). ring only, as cmux-tui ("rustls only", no aws-lc-rs).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2"
zeroize = "1"
