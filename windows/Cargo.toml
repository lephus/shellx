[workspace]
members = ["shellx-model", "shellx-remote", "shellx-app"]
# vendor/ holds patched copies of crates.io crates: path dependencies, never members.
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "1.7.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 4

# gpui 0.2.2, vendored to carry fixes (windows/vendor/README.md). Every build uses this copy.
[patch.crates-io]
gpui = { path = "vendor/gpui-0.2.2" }
