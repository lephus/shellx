[workspace]
members = ["shellx-model", "shellx-remote", "shellx-app"]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 4
