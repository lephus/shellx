# nginx of the `web` container (VPS spec §3), installed as /etc/nginx/conf.d/default.conf.
# nginx-proxy terminates TLS and forwards by Host to port 80 here. Nothing is logged per request:
# no access log, and no "file not found" lines (they would carry the client address) — the privacy
# policy promises that visits are not logged.

# shellx.pro: the Astro site. /privacy answers 301 → /privacy/ (relative Location, so it stays on
# https behind the proxy), unknown paths answer 404 with the site's 404 page.
server {
    listen 80 default_server;
    server_name shellx.pro;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    log_not_found off;
    server_tokens off;
    absolute_redirect off;
    error_page 404 /404.html;

    # /index.html, /en/index.html, /privacy/index.html … → 301 to the folder URL (the canonical one).
    # Tested on $request_uri, the URL the client sent, so the internal `index` lookup of "/" does
    # not loop.
    if ($request_uri ~ "^([^?]*/)index\.html(\?.*)?$") {
        return 301 $1$2;
    }

    location / {
    }

    location ~ "^/s/[0-9a-z]{4}-[0-9a-z]{4}/?$" {
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src https://relay.shellx.pro wss://relay.shellx.pro; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
        try_files /s/index.html =404;
    }

    # /s/ without an id must not fall through to location / (it would serve /s/index.html as the
    # directory index, without the viewer headers). /s/index.html is internal: only try_files
    # above serves the viewer, and it does so as a file in this context, so the headers apply.
    location = /s/ {
        return 404;
    }

    location = /s/index.html {
        internal;
    }

    location = /404.html {
        internal;
    }
}

# www.shellx.pro → https://shellx.pro, keeping the path and query.
server {
    listen 80;
    server_name www.shellx.pro;
    access_log off;
    log_not_found off;
    server_tokens off;
    return 301 https://shellx.pro$request_uri;
}

# download.shellx.pro: installers rsynced by release-desktop.yml into downloads/desktop/<version>/.
# Files only: a directory (with or without the trailing slash) answers 404, never a listing.
# Found files are always downloads and never change (a new release gets a new version path).
server {
    listen 80;
    server_name download.shellx.pro;
    root /srv/downloads;
    access_log off;
    log_not_found off;
    server_tokens off;
    autoindex off;

    location / {
        try_files $uri =404;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }
}
