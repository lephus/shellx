# ShellX on the VPS (VPS spec §3). Lives in ~/phu/shellx (GitHub variable VPS_APP_DIR) next to
# relay.env and .env; deploy.yml syncs this file and sets IMAGE_TAG in .env. PROXY_NETWORK is
# written into .env once by hand (deploy/README.md, step 2).
name: shellx

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  relay:
    image: ghcr.io/lephus/shellx-relay:${IMAGE_TAG:?IMAGE_TAG is not set in .env}
    restart: unless-stopped
    # Hard memory ceiling (VPS spec §3, §4.3): past it the kernel kills the relay, not a neighbour on the
    # shared VPS; `restart` brings it back and clients reconnect with backoff. memswap_limit equal to
    # mem_limit means no swap on top (otherwise a host with swap allows twice as much). Compose v2
    # syntax: `deploy.resources` is ignored without swarm.
    mem_limit: 512m
    memswap_limit: 512m
    env_file: relay.env
    environment:
      # admin.shellx.pro is the relay's admin dashboard: the relay answers it by Host header alone
      # (relay/src/admin/), so both names point at this one container.
      VIRTUAL_HOST: relay.shellx.pro,admin.shellx.pro
      VIRTUAL_PORT: "8080"
      LETSENCRYPT_HOST: relay.shellx.pro,admin.shellx.pro
      # One certificate per name, so a problem issuing admin.shellx.pro's can never touch the
      # relay's certificate (the apps' only way in).
      LETSENCRYPT_SINGLE_DOMAIN_CERTS: "true"
      HOST: 0.0.0.0
      PORT: "8080"
      DB_PATH: /data/relay.db
      # Push notifications (push spec §5): path of the Firebase service account key inside the
      # container, e.g. /secrets/fcm.json, set once by hand in .env (deploy/README.md, "Push
      # notifications"). Empty → push is off and the relay runs as before.
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      # Password of admin.shellx.pro, set once by hand in the VPS's .env (deploy/README.md, "Admin"),
      # never in this repository. Empty or under 16 characters → the dashboard stays disabled.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Raw key of the v2 tickets the relay mints for cmux-relay (relay2), set once by hand in the VPS's
      # .env (deploy/README.md, "Relay v2"), never in this repository. Empty → /v2 tickets answer 503
      # and v1 is untouched.
      CMUX_RELAY_HMAC_SECRET: ${CMUX_RELAY_HMAC_SECRET:-}
    volumes:
      # SQLite database; the directory must belong to uid 1000 (the image's `node` user).
      - ./data:/data
      # Secrets kept on the VPS only (never synced by deploy.yml), read-only; fcm.json must be
      # readable by uid 1000.
      - ./secrets:/secrets:ro
      # Native desktop latest manifests (latest-macos.json / latest-windows.json), read-only.
      - ./downloads/desktop:/srv/downloads/desktop:ro
    healthcheck:
      # dist/scripts/healthcheck.js (relay/src/scripts/healthcheck.ts) checks both the HTTP endpoint
      # and that the SQLite database opens read-only, and prints nothing on success.
      test: ["CMD", "node", "dist/scripts/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    # SIGTERM → sockets closed with 1001, requests drained (≤ 5 s), database closed (spec §4.3).
    stop_grace_period: 10s
    logging: *logging
    networks: [proxy]

  # cmux-relay (Rust), the v2 transport for the native desktop apps. Built ON THE VPS from the pinned
  # commit staged in relay2-src/<sha> (no registry image: nothing is pulled or pushed for it), and only
  # started when .env has COMPOSE_PROFILES=relay2 (deploy/README.md, "Relay v2"). Bump the sha in all
  # three places (image tag, context, REVISION) to move to a new commit.
  relay2:
    profiles: ["relay2"]
    # Local tag only, never pushed.
    image: shellx-relay2:57dd520ccf20b55c7eac662f1e09eae1c5069917
    pull_policy: never
    build:
      context: ./relay2-src/57dd520ccf20b55c7eac662f1e09eae1c5069917
      dockerfile: scripts/shellx/relay2/Dockerfile
      args:
        REVISION: 57dd520ccf20b55c7eac662f1e09eae1c5069917
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    read_only: true
    # Listens on 8787 as uid 10001: no capability needed, and no setuid escalation.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      # Same host as the relay, exact path match: a prefix location would also swallow
      # POST /v2/relay/tickets, which the Node relay serves. VIRTUAL_DEST rewrites to cmux-relay's only
      # WebSocket path. No certificate settings of its own: the relay service owns relay.shellx.pro's certificate.
      VIRTUAL_HOST: relay.shellx.pro
      VIRTUAL_PATH: "= /v2/relay"
      VIRTUAL_DEST: /v1/relay
      VIRTUAL_PORT: "8787"
      CMUX_RELAY_BIND: 0.0.0.0:8787
      CMUX_RELAY_HMAC_SECRET: ${CMUX_RELAY_HMAC_SECRET:-}
      # Exactly this text, no whitespace, here and in relay.env: Node trims it, cmux-relay does not.
      CMUX_RELAY_ISSUER: shellx-relay
      # The browser share viewer on https://shellx.pro; any other Origin is still answered 403.
      CMUX_RELAY_ALLOWED_ORIGINS: https://shellx.pro
    healthcheck:
      # The runtime image (debian bookworm-slim) has bash but no curl or wget.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8787 && printf 'GET /healthz HTTP/1.1\\r\\nHost: l\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"ok\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging
    networks: [proxy]

  web:
    image: ghcr.io/lephus/shellx-web:${IMAGE_TAG:?IMAGE_TAG is not set in .env}
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: shellx.pro,www.shellx.pro,download.shellx.pro
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: shellx.pro,www.shellx.pro,download.shellx.pro
    volumes:
      - ./downloads:/srv/downloads:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--header", "Host: shellx.pro", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging
    networks: [proxy]

  backup:
    image: alpine:3.22
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup/entrypoint.sh"]
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
      - ./backup:/backup:ro
      # 03:00 in the VPS's own time zone.
      - /etc/localtime:/etc/localtime:ro
    logging: *logging
    # Not on the proxy network; the project's default network lets it install sqlite at start.

networks:
  proxy:
    name: ${PROXY_NETWORK:?PROXY_NETWORK is not set in .env}
    external: true
