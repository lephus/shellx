# ShellX on the VPS (VPS spec §3). Lives in ~/phu/shellx (GitHub variable VPS_APP_DIR) next to
# relay.env and .env; deploy.yml syncs this file and sets IMAGE_TAG in .env. PROXY_NETWORK is
# written into .env once by hand (deploy/README.md, step 2).
name: shellx

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  relay:
    image: ghcr.io/lephus/shellx-relay:${IMAGE_TAG:?IMAGE_TAG is not set in .env}
    restart: unless-stopped
    # Hard memory ceiling (VPS spec §3, §4.3): past it the kernel kills the relay, not a neighbour on the
    # shared VPS; `restart` brings it back and clients reconnect with backoff. memswap_limit equal to
    # mem_limit means no swap on top (otherwise a host with swap allows twice as much). Compose v2
    # syntax: `deploy.resources` is ignored without swarm.
    mem_limit: 512m
    memswap_limit: 512m
    env_file: relay.env
    environment:
      # admin.shellx.pro is the relay's admin dashboard: the relay answers it by Host header alone
      # (relay/src/admin/), so both names point at this one container.
      VIRTUAL_HOST: relay.shellx.pro,admin.shellx.pro
      VIRTUAL_PORT: "8080"
      LETSENCRYPT_HOST: relay.shellx.pro,admin.shellx.pro
      # One certificate per name, so a problem issuing admin.shellx.pro's can never touch the
      # relay's certificate (the apps' only way in).
      LETSENCRYPT_SINGLE_DOMAIN_CERTS: "true"
      HOST: 0.0.0.0
      PORT: "8080"
      DB_PATH: /data/relay.db
      # Push notifications (push spec §5): path of the Firebase service account key inside the
      # container, e.g. /secrets/fcm.json, set once by hand in .env (deploy/README.md, "Push
      # notifications"). Empty → push is off and the relay runs as before.
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      # Password of admin.shellx.pro, set once by hand in the VPS's .env (deploy/README.md, "Admin"),
      # never in this repository. Empty or under 16 characters → the dashboard stays disabled.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      # SQLite database; the directory must belong to uid 1000 (the image's `node` user).
      - ./data:/data
      # Secrets kept on the VPS only (never synced by deploy.yml), read-only; fcm.json must be
      # readable by uid 1000.
      - ./secrets:/secrets:ro
    healthcheck:
      # dist/scripts/healthcheck.js (relay/src/scripts/healthcheck.ts) checks both the HTTP endpoint
      # and that the SQLite database opens read-only, and prints nothing on success.
      test: ["CMD", "node", "dist/scripts/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    # SIGTERM → sockets closed with 1001, requests drained (≤ 5 s), database closed (spec §4.3).
    stop_grace_period: 10s
    logging: *logging
    networks: [proxy]

  web:
    image: ghcr.io/lephus/shellx-web:${IMAGE_TAG:?IMAGE_TAG is not set in .env}
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: shellx.pro,www.shellx.pro,download.shellx.pro
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: shellx.pro,www.shellx.pro,download.shellx.pro
    volumes:
      - ./downloads:/srv/downloads:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--header", "Host: shellx.pro", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging
    networks: [proxy]

  backup:
    image: alpine:3.22
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup/entrypoint.sh"]
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
      - ./backup:/backup:ro
      # 03:00 in the VPS's own time zone.
      - /etc/localtime:/etc/localtime:ro
    logging: *logging
    # Not on the proxy network; the project's default network lets it install sqlite at start.

networks:
  proxy:
    name: ${PROXY_NETWORK:?PROXY_NETWORK is not set in .env}
    external: true
