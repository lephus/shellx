# Gradle settings for the ShellX Android build. The memory limits come from ~/.gradle/gradle.properties on the
# maintainer's Mac (16 GB RAM): do not set org.gradle.jvmargs here.
kotlin.code.style=official
# AGP must never download SDK packages (platforms, build tools): the user installs them with sdkmanager.
# scripts/shellx/check-android-license.sh refuses this file without the line.
android.builder.sdkDownload=false
